name: Bug report
description: Something in the extension or the site is broken, wrong or stuck.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the lyrics for a track are missing, wrong or out of time, that usually comes from the lyric source rather than the extension — say so below and include the track.

        Loading the build from a folder rather than the store? Please try the current release first.
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you see, and when it starts. A screenshot pasted straight into this box is fine.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where is it
      options:
        - Lyrics panel (words, timing, translation)
        - Fullscreen lyrics
        - Aurora Bloom backdrop or artwork tinting
        - Next Up
        - Song notes
        - Sleep timer
        - Picture-in-picture lyrics
        - A snippet (centered home, arrow keys, NPV panel, track toast)
        - Settings or the add-ons panel
        - The website
        - Not sure
    validations:
      required: true
  - type: input
    id: track
    attributes:
      label: Track
      description: Song and artist, when it happens on one track in particular.
      placeholder: Song name — Artist
  - type: dropdown
    id: repeatable
    attributes:
      label: Does reloading the YouTube Music tab fix it?
      options:
        - "No, it comes back"
        - "Yes, until the next reload"
        - "Not tried"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the Aurora Lyrics card in `chrome://extensions`.
      placeholder: 0.7.5
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: First line of `chrome://version`, or Help → About Google Chrome.
      placeholder: 141.0.7390.55
    validations:
      required: true
  - type: dropdown
    id: other-extensions
    attributes:
      label: Another extension that changes YouTube Music is enabled
      description: Other lyric or theme extensions can fight over the same elements.
      options:
        - "No"
        - "Yes — named below"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Only if something is throwing. On the YouTube Music tab press Ctrl+Shift+J (Cmd+Option+J on a Mac), open the panel again, and paste what turned red.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I searched the open issues for the same problem.
        - label: I am on the latest version from the Chrome Web Store.
